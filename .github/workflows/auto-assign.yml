name: Auto Assign

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign-creator:
    name: Assign PR Creator
    # Bots cannot be assignees: the REST call is rejected with "Assigning
    # agents is not supported with GitHub App installation tokens", which
    # reds every Dependabot pull request.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Add PR creator as assignee
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-assignee "${{ github.event.pull_request.user.login }}"
